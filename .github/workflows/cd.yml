name: CD

# Se déclenche à la fin du workflow CI sur main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  DOCKERHUB_IMAGE: crazzybuilds/sysinfo-api
  GHCR_IMAGE: ghcr.io/crazzybuilds/sysinfo-api
  # Commit testé par la CI : c'est exactement celui-ci qu'on publie
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    # Uniquement si la CI a réussi
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    # Le GITHUB_TOKEN doit pouvoir publier sur GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupération du code testé par la CI
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Connexion à Docker Hub
        uses: docker/login-action@v4
        with:
          username: crazzybuilds
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction et publication de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.COMMIT_SHA }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ env.COMMIT_SHA }}

  deploy:
    # Uniquement après une publication réussie de l'image
    needs: publish
    runs-on: ubuntu-latest

    # id-token : permet de demander un jeton OIDC à GitHub pour Azure
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Connexion à Azure (OIDC, sans mot de passe)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Crée le conteneur s'il n'existe pas, sinon le met à jour.
      # Le tag (hash du commit) change à chaque version : Azure redéploie.
      - name: Déploiement sur Azure Container Instances
        run: |
          az container create \
            --resource-group rg-sysinfo \
            --name sysinfo-api \
            --location francecentral \
            --image docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ env.COMMIT_SHA }} \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --ports 8000 \
            --ip-address Public \
            --dns-name-label sysinfo-crazzybuilds \
            --query ipAddress.fqdn \
            --output tsv
