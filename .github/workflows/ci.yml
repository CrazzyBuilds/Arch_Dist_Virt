name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Compilation
        run: npm run build

      - name: Tests
        run: npm test
